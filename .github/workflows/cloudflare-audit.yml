name: Cloudflare Audit

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-audit
  cancel-in-progress: false

jobs:
  pages-project:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Capture sanitized Pages project metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/cloudflare-audit.sh project

      - name: Capture and verify sanitized live headers
        run: bash .github/scripts/cloudflare-audit.sh headers

      - name: Upload sanitized audit artifact
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-audit-${{ github.run_id }}
          path: cloudflare-audit/
          if-no-files-found: warn
          retention-days: 14

  # Cloudflare dashboard settings can rewrite live responses in ways that
  # _headers and the build cannot control. These checks stay out of
  # smoke-pages.sh on purpose: a smoke failure rolls production back, and a
  # rollback cannot change a dashboard setting. This job only reports.
  edge-settings:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify Cloudflare dashboard settings at the live edge
        run: bash .github/scripts/cloudflare-edge-settings.sh

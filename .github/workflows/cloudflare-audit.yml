name: Cloudflare Audit

on:
  schedule:
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Capture sanitized Pages project metadata
        shell: bash
        env:
          CLOUDFLARE_AUDIT_API_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_API_TOKEN }}
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_LEGACY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_VARIABLE: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ACCOUNT_ID_LEGACY: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          mkdir -p cloudflare-audit

          token="${CLOUDFLARE_AUDIT_API_TOKEN:-${CLOUDFLARE_PAGES_API_TOKEN:-$CLOUDFLARE_API_TOKEN_LEGACY}}"
          account_id="${CLOUDFLARE_ACCOUNT_ID_VARIABLE:-$CLOUDFLARE_ACCOUNT_ID_LEGACY}"
          if [ -z "$token" ] || [ -z "$account_id" ]; then
            echo "::error::Cloudflare audit requires a read token and CLOUDFLARE_ACCOUNT_ID."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_AUDIT_API_TOKEN" ]; then
            echo "::warning::Use a dedicated CLOUDFLARE_AUDIT_API_TOKEN with Pages Read for least privilege."
          fi

          raw_project="$RUNNER_TEMP/cloudflare-pages-project.json"
          curl \
            --fail \
            --silent \
            --show-error \
            --retry 3 \
            --retry-all-errors \
            --header "Authorization: Bearer $token" \
            --header "Content-Type: application/json" \
            --output "$raw_project" \
            "https://api.cloudflare.com/client/v4/accounts/$account_id/pages/projects/alexnava-me"

          jq -e '
            .success == true and
            .result.name == "alexnava-me" and
            .result.production_branch == "main" and
            ((.result.domains // []) | index("alexnava.me")) != null
          ' "$raw_project" >/dev/null

          jq \
            --arg checked_at "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
              checked_at: $checked_at,
              project: {
                name: .result.name,
                subdomain: .result.subdomain,
                production_branch: .result.production_branch,
                domains: ((.result.domains // []) | sort),
                created_on: .result.created_on
              }
            }' \
            "$raw_project" > cloudflare-audit/pages-project.json

      - name: Capture and verify sanitized live headers
        shell: bash
        run: |
          set -euo pipefail

          extract_final_header_block() {
            local raw_headers="$1"
            local final_headers="$2"

            tr -d '\r' < "$raw_headers" |
              awk '
                /^HTTP\// {
                  block = $0 ORS
                  capture = 1
                  next
                }
                capture {
                  block = block $0 ORS
                  if ($0 == "") {
                    final = block
                    block = ""
                    capture = 0
                  }
                }
                END {
                  if (block != "") {
                    final = block
                  }
                  printf "%s", final
                }' > "$final_headers"
          }

          sanitize_headers() {
            local label="$1"
            local raw_headers="$2"
            local final_headers="$RUNNER_TEMP/${label}-final-headers.txt"

            extract_final_header_block "$raw_headers" "$final_headers"
            awk 'BEGIN { IGNORECASE=1 }
                /^HTTP\// ||
                /^(cache-control|content-security-policy|cross-origin-opener-policy|cross-origin-resource-policy|location|permissions-policy|referrer-policy|strict-transport-security|x-content-type-options|x-frame-options|x-robots-tag):/ {
                  print
                }' "$final_headers" > "cloudflare-audit/${label}-headers.txt"
          }

          apex_raw_headers="$RUNNER_TEMP/apex-headers.txt"
          apex_body="$RUNNER_TEMP/apex-body.html"
          apex_meta="$(
            curl \
              --silent \
              --show-error \
              --max-redirs 0 \
              --retry 3 \
              --retry-all-errors \
              --dump-header "$apex_raw_headers" \
              --output "$apex_body" \
              --write-out '%{http_code} %{url_effective}' \
              "https://alexnava.me/"
          )"
          sanitize_headers "apex" "$apex_raw_headers"
          read -r apex_status apex_effective_url <<< "$apex_meta"
          apex_effective_host="${apex_effective_url#*://}"
          apex_effective_host="${apex_effective_host%%/*}"
          apex_effective_host="${apex_effective_host%%:*}"
          if [ "$apex_status" != "200" ] ||
            [ "$apex_effective_host" != "alexnava.me" ] ||
            [ "$apex_effective_url" != "https://alexnava.me/" ]; then
            echo "::error::apex must return 200 directly from https://alexnava.me/ without redirecting."
            exit 1
          fi
          grep -Fq "<title>Alex Nava</title>" "$apex_body"

          pages_raw_headers="$RUNNER_TEMP/pages-dev-headers.txt"
          pages_body="$RUNNER_TEMP/pages-dev-body.html"
          pages_status="$(
            curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --dump-header "$pages_raw_headers" \
              --output "$pages_body" \
              --write-out '%{http_code}' \
              "https://alexnava-me.pages.dev/"
          )"
          sanitize_headers "pages-dev" "$pages_raw_headers"

          apex_headers="cloudflare-audit/apex-headers.txt"
          pages_headers="cloudflare-audit/pages-dev-headers.txt"
          grep -Eq '^HTTP/[^ ]+[[:space:]]+200([[:space:]]|$)' "$apex_headers"
          grep -Eiq "^content-security-policy:.*form-action 'none'.*frame-src 'none'.*worker-src 'none'" "$apex_headers"
          grep -Eiq '^strict-transport-security:[[:space:]]*max-age=31536000' "$apex_headers"
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' "$apex_headers"

          if [ "$pages_status" = "200" ]; then
            grep -Fq "<title>Alex Nava</title>" "$pages_body"
            grep -Eiq '^x-robots-tag:.*noindex' "$pages_headers"
            pages_result="200 with X-Robots-Tag noindex"
          elif { [ "$pages_status" = "301" ] || [ "$pages_status" = "308" ]; } &&
            grep -Eiq '^location:[[:space:]]*https://alexnava\.me/[[:space:]]*$' "$pages_headers"; then
            canonical_headers="$RUNNER_TEMP/pages-dev-canonical-headers.txt"
            canonical_status="$(
              curl \
                --silent \
                --show-error \
                --retry 3 \
                --retry-all-errors \
                --dump-header "$canonical_headers" \
                --output /dev/null \
                --write-out '%{http_code}' \
                "https://alexnava-me.pages.dev/__babel-canonical-check?source=cloudflare-audit&keep=1"
            )"
            canonical_final_headers="$RUNNER_TEMP/pages-dev-canonical-final-headers.txt"
            extract_final_header_block "$canonical_headers" "$canonical_final_headers"
            if { [ "$canonical_status" != "301" ] && [ "$canonical_status" != "308" ]; } ||
              ! grep -Eiq '^location:[[:space:]]*https://alexnava\.me/__babel-canonical-check\?source=cloudflare-audit&keep=1[[:space:]]*$' "$canonical_final_headers"; then
              echo "::error::pages.dev canonical redirect must preserve path and query."
              exit 1
            fi
            pages_result="$pages_status canonical redirect to apex"
          else
            echo "::error::pages.dev must return 200 with noindex or 301/308 to the apex."
            exit 1
          fi

          www_raw_headers="$RUNNER_TEMP/www-headers.txt"
          www_status="$(
            curl \
              --silent \
              --show-error \
              --retry 3 \
              --retry-all-errors \
              --dump-header "$www_raw_headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              "https://www.alexnava.me/"
          )"
          sanitize_headers "www" "$www_raw_headers"
          www_headers="cloudflare-audit/www-headers.txt"
          if [ "$www_status" != "301" ] ||
            ! grep -Eiq '^location:[[:space:]]*https://alexnava\.me/[[:space:]]*$' "$www_headers"; then
            echo "::error::www must return 301 with Location: https://alexnava.me/"
            exit 1
          fi

          {
            printf '# Cloudflare audit\n\n'
            printf -- '- Checked: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            printf -- '- Repository revision: `%s`\n' "$GITHUB_SHA"
            printf -- '- Pages project: `alexnava-me`\n'
            printf -- '- Production branch: `main`\n'
            printf -- '- Public DNS/TLS reachability, apex marker, and security headers: pass\n'
            printf -- '- www exact 301 redirect: pass\n'
            printf -- '- Exact pages.dev canonicalization: %s\n' "$pages_result"
          } > cloudflare-audit/summary.md
          cat cloudflare-audit/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitized audit artifact
        if: always()
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cloudflare-audit-${{ github.run_id }}
          path: cloudflare-audit/
          if-no-files-found: warn
          retention-days: 14

  # Cloudflare dashboard settings can rewrite live responses in ways that
  # _headers and the build cannot control. These checks stay out of
  # smoke-pages.sh on purpose: a smoke failure rolls production back, and a
  # rollback cannot change a dashboard setting. This job only reports.
  edge-settings:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Verify Cloudflare dashboard settings at the live edge
        shell: bash
        run: |
          set -euo pipefail

          origin="https://alexnava.me"
          origin_host="alexnava.me"
          browser_ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
          checklist="See the Cloudflare dashboard checklist in docs/OPERATIONS.md; after changing the dashboard, run this workflow manually."
          work="$RUNNER_TEMP/edge-settings"
          mkdir -p "$work"
          failures=()
          summary=()

          pass() {
            summary+=("- $1: pass${2:+ ($2)}")
          }

          # fail LABEL MESSAGE [HINT]: HINT defaults to the dashboard checklist.
          fail() {
            local hint="${3-$checklist}"
            failures+=("$1: $2")
            summary+=("- $1: **fail**")
            echo "::error title=$1::$2${hint:+ $hint}"
          }

          finish() {
            {
              printf '# Cloudflare edge settings\n\n'
              printf -- '- Checked: %s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              printf '%s\n' "${summary[@]}"
              if [ "${#failures[@]}" -gt 0 ]; then
                printf '\n## Failures\n\n'
                printf -- '- %s\n' "${failures[@]}"
                printf '\nDashboard settings are fixed in Cloudflare, not in this repository. %s\n' "$checklist"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "${#failures[@]}" -gt 0 ]; then
              echo "::error::${#failures[@]} Cloudflare edge check(s) failed; see the step summary. $checklist"
              exit 1
            fi
            echo "All Cloudflare edge checks passed."
          }

          extract_final_header_block() {
            local raw_headers="$1"
            local final_headers="$2"

            tr -d '\r' < "$raw_headers" |
              awk '
                /^HTTP\// {
                  block = $0 ORS
                  capture = 1
                  next
                }
                capture {
                  block = block $0 ORS
                  if ($0 == "") {
                    final = block
                    block = ""
                    capture = 0
                  }
                }
                END {
                  if (block != "") {
                    final = block
                  }
                  printf "%s", final
                }' > "$final_headers"
          }

          # fetch NAME PATH [curl options]: saves the body to $work/NAME.body and
          # the final response's headers to $work/NAME.headers; prints the status.
          fetch() {
            local name="$1"
            local path="$2"
            shift 2
            : > "$work/$name.raw-headers"
            : > "$work/$name.body"
            curl \
              --silent \
              --show-error \
              --max-redirs 0 \
              --retry 3 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 60 \
              --user-agent "$browser_ua" \
              --dump-header "$work/$name.raw-headers" \
              --output "$work/$name.body" \
              --write-out '%{http_code}' \
              "$@" \
              "$origin$path" || true
            extract_final_header_block "$work/$name.raw-headers" "$work/$name.headers"
          }

          # header NAME FILE: every value of one header in a final header block.
          header() {
            { grep -i "^$1:" "$2" || true; } |
              sed -E 's/^[^:]+:[[:space:]]*//; s/[[:space:]]+$//' |
              awk 'NR > 1 { printf ", " } { printf "%s", $0 }'
          }

          # The page as a browser requests it: dashboard rewrites such as email
          # obfuscation and analytics injection apply only to HTML requests.
          html_status="$(
            fetch html "/" \
              --compressed \
              --header 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          )"
          tr '\r\n' '  ' < "$work/html.body" > "$work/html.flat"
          if [ "$html_status" != "200" ] || ! grep -Fq "<title>Alex Nava</title>" "$work/html.flat"; then
            fail "Browser request" "A browser-like request for $origin/ returned HTTP $html_status without the page marker, so no edge setting could be checked. Look for a challenge or block under Security (WAF, Bots) that applies to browsers on GitHub-hosted runners."
            finish
          fi
          pass "Browser request" "HTTP 200"

          if grep -Fq 'href="mailto:alexonava@gmail.com"' "$work/html.flat" &&
            ! grep -Fq '/cdn-cgi/l/email-protection' "$work/html.flat"; then
            pass "Contact email link"
          else
            fail "Contact email link" "The page must keep href=\"mailto:alexonava@gmail.com\" and contain no /cdn-cgi/l/email-protection link; Email Address Obfuscation is rewriting it. Turn off Scrape Shield → Email Address Obfuscation."
          fi

          { grep -oiE '<script[^>]*>' "$work/html.flat" || true; } |
            sed -nE "s/.*[[:space:]][sS][rR][cC][[:space:]]*=[[:space:]]*[\"']?([^\"' >]+).*/\1/p" \
              > "$work/script-srcs"
          third_party_hosts="$(
            while IFS= read -r src; do
              case "${src,,}" in
                http://* | https://* | //*)
                  host="${src#*//}"
                  host="${host%%[/?#]*}"
                  host="${host%%:*}"
                  host="${host,,}"
                  if [ "$host" != "$origin_host" ]; then
                    printf '%s\n' "$host"
                  fi
                  ;;
              esac
            done < "$work/script-srcs" | sort -u | paste -sd ' ' -
          )"
          if [ -z "$third_party_hosts" ]; then
            pass "Same-origin scripts only"
          else
            fail "Same-origin scripts only" "The page loads scripts from $third_party_hosts, which the CSP blocks. Turn off automatic Web Analytics/RUM injection (Workers & Pages → alexnava-me → Metrics → Web Analytics, and Speed → Observatory → RUM)."
          fi

          html_cache_control="$(header cache-control "$work/html.headers")"
          if [[ "${html_cache_control,,}" == *no-store* ]]; then
            fail "HTML Cache-Control" "The page's Cache-Control is \"$html_cache_control\"; _headers sends public, max-age=0, must-revalidate. Remove the rule that appends no-store (Rules → Transform Rules or Cache Rules, Caching → Browser Cache TTL, or a Snippet)."
          else
            pass "HTML Cache-Control" "${html_cache_control:-none}"
          fi

          # Fingerprinted assets: the page names the app, CSS and scene entry,
          # and the entry imports the shared scene chunk, which the app preloads.
          cache_findings=()
          checked_assets=0
          check_immutable() {
            local name="$1"
            local asset_path="$2"
            local status
            local cache_control
            status="$(fetch "$name" "$asset_path" --compressed)"
            cache_control="$(header cache-control "$work/$name.headers")"
            checked_assets=$((checked_assets + 1))
            if [ "$status" != "200" ]; then
              cache_findings+=("$asset_path returned HTTP $status")
            elif [[ "${cache_control,,}" != *immutable* ]] || [[ "${cache_control,,}" == *no-store* ]]; then
              cache_findings+=("$asset_path sends Cache-Control \"${cache_control:-none}\"")
            fi
          }

          app_path="$(grep -oE '/scripts/app\.[a-f0-9]{8}\.js' "$work/html.flat" | head -n 1 || true)"
          css_path="$(grep -oE '/css/styles\.[a-f0-9]{8}\.css' "$work/html.flat" | head -n 1 || true)"
          entry_path="$(
            { grep -oiE '<meta[^>]*name="babel:scene-script"[^>]*>' "$work/html.flat" || true; } |
              grep -oE '/scripts/scene\.[a-f0-9]{8}\.js' | head -n 1 || true
          )"
          : > "$work/app.body"
          : > "$work/entry.body"
          if [ -n "$app_path" ]; then
            check_immutable app "$app_path"
          fi
          if [ -n "$css_path" ]; then
            check_immutable css "$css_path"
          fi
          if [ -n "$entry_path" ]; then
            check_immutable entry "$entry_path"
          fi

          # Static imports only: the lazily imported developer chunk is excluded.
          chunk_paths="$(
            {
              { grep -oE "(from|import)[[:space:]]*[\"']\./scene\.[a-z0-9.-]+\.js[\"']" "$work/entry.body" || true; } |
                grep -oE 'scene\.[a-z0-9.-]+\.js' | sed 's|^|/scripts/|' || true
              grep -oE '/scripts/scene\.[a-z0-9-]+\.[a-f0-9]{8}\.js' "$work/app.body" || true
            } | sort -u
          )"
          chunk_index=0
          for chunk_path in $chunk_paths; do
            chunk_index=$((chunk_index + 1))
            check_immutable "chunk-$chunk_index" "$chunk_path"
          done

          missing=""
          [ -n "$app_path" ] || missing="$missing the app script;"
          [ -n "$css_path" ] || missing="$missing the stylesheet;"
          [ -n "$entry_path" ] || missing="$missing the babel:scene-script entry;"
          grep -Eq '^/scripts/scene\.shared\.[a-f0-9]{8}\.js$' <<< "$chunk_paths" ||
            missing="$missing the shared scene chunk;"
          if [ -n "$missing" ]; then
            fail "Fingerprinted asset discovery" "Could not find${missing%;}. A production build from before the scene split has no shared chunk; otherwise update this audit's discovery patterns to match build.mjs." ""
          fi

          if [ "${#cache_findings[@]}" -gt 0 ]; then
            findings="$(printf '%s; ' "${cache_findings[@]}")"
            fail "Immutable fingerprinted assets" "${findings%; }. _headers makes hashed scripts and CSS public, max-age=31536000, immutable. Remove the rule that appends no-store (Rules → Transform Rules or Cache Rules, Caching → Browser Cache TTL, or a Snippet)."
          elif [ "$checked_assets" -gt 0 ]; then
            pass "Immutable fingerprinted assets" "$checked_assets checked"
          fi

          glb_path="$(
            cat "$work/entry.body" "$work/app.body" |
              grep -oE '/images/architecture/tower-high\.[a-f0-9]{8}\.glb' | head -n 1 || true
          )"
          if [ -z "$glb_path" ]; then
            fail "GLB compression" "Could not find a fingerprinted tower-high GLB in the scene entry or app script; update this audit's discovery pattern to match build.mjs." ""
          else
            glb_status="$(fetch glb "$glb_path" --header 'Accept-Encoding: br, gzip')"
            rm -f "$work/glb.body"
            glb_encoding="$(header content-encoding "$work/glb.headers")"
            case "$glb_status:${glb_encoding,,}" in
              200:br | 200:gzip)
                pass "GLB compression" "$glb_encoding"
                ;;
              *)
                fail "GLB compression" "$glb_path returned HTTP $glb_status with Content-Encoding \"${glb_encoding:-none}\" to Accept-Encoding br, gzip. Add a Compression Rule (Rules → Compression Rules) that enables Brotli for model/gltf-binary and application/octet-stream."
                ;;
            esac
          fi

          finish

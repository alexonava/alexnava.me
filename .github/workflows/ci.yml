name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One build per run: the audit and the preview use its dist/ artifact.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit npm dependencies (high and critical)
        run: npm run audit:ci

      - name: Check formatting
        run: npm run format:check

      - name: Verify source entry points
        run: npm run verify

      - name: Run test suite
        run: npm test

      - name: Build deployable site
        run: npm run build:dist

      - name: Upload site payload
        # actions/upload-artifact@v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  audit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Only for lighthouserc.json; nothing is installed or built here.
      - name: Check out repository
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download site payload
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
          path: dist

      - name: Run Lighthouse CI
        # treosh/lighthouse-ci-action@v12
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.cloudflare.outputs.ready }}
      preview_url: ${{ steps.deploy.outputs.url }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    # No checkout and no npm ci: the credentialed job runs only the built
    # payload and a pinned Wrangler, never the pull request's code.
    steps:
      - name: Set up trusted Node.js runtime
        # actions/setup-node@v7.0.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Download site payload
        # actions/download-artifact@v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
          path: dist

      - name: Check preview deploy credential presence
        id: cloudflare
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::The Cloudflare repository secrets are not configured; skipping preview deploy."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Install pinned Wrangler
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --global --ignore-scripts --no-audit --no-fund wrangler@4.145.0

      - name: Validate preview deploy credentials
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! wrangler pages project list >/dev/null 2>&1; then
            echo "::error::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are set but invalid."
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        if: steps.cloudflare.outputs.ready == 'true'
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          raw_branch="$BRANCH_REF"
          sanitized="$(printf '%s' "$raw_branch" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed -E 's/-+/-/g; s/^-//; s/-$//')"
          # Cloudflare Pages limits subdomains to 28 chars.
          branch_slug="$(printf '%s' "$sanitized" | cut -c1-20 | sed -E 's/-$//')"
          if [ -z "$branch_slug" ]; then
            branch_slug="run-${GITHUB_RUN_ID}"
          fi
          # A preview token must never be able to publish the production branch.
          short_branch="preview-${branch_slug}"
          echo "Raw branch:        $raw_branch"
          echo "Sanitized branch:  $short_branch"
          output="$(wrangler pages deploy dist --project-name=alexnava-me --branch="$short_branch" 2>&1)"
          printf '%s\n' "$output"
          url="$(printf '%s' "$output" | grep -oE 'https://[a-z0-9-]+\.alexnava-me\.pages\.dev' | tail -1)"
          if [ -z "$url" ]; then
            echo "::error::Could not parse preview URL from wrangler output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "## Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-check preview
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/preview-body.html"
          headers="$RUNNER_TEMP/preview-headers.txt"
          expected_host="${PREVIEW_URL#https://}"
          expected_host="${expected_host%%/*}"
          if ! printf '%s' "$expected_host" | grep -Eq '^[a-z0-9-]+\.alexnava-me\.pages\.dev$'; then
            echo "::error::Unexpected preview deployment host: $expected_host"
            exit 1
          fi

          for attempt in 1 2 3 4 5 6; do
            : > "$headers"
            result="$(
              curl \
              --silent \
              --show-error \
              --connect-timeout 10 \
              --max-time 20 \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}\t%{url_effective}' \
              "$PREVIEW_URL" ||
                true
            )"
            status="${result%%$'\t'*}"
            effective_url="${result#*$'\t'}"
            effective_host="${effective_url#https://}"
            effective_host="${effective_host%%/*}"
            if [ "$status" = "200" ] &&
              [ "$effective_host" = "$expected_host" ] &&
              grep -Fq "<title>Alex Nava</title>" "$body"; then
              echo "Preview smoke check passed."
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              echo "Preview smoke attempt $attempt failed; retrying in 5 seconds."
              sleep 5
            fi
          done

          echo "::error::Preview smoke check failed after 6 attempts."
          exit 1

  comment:
    if: needs.preview.outputs.ready == 'true'
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment preview URL on PR
        # actions/github-script@v9.0.0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = '<!-- preview-pages-comment -->';
            const body = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `${process.env.PREVIEW_URL}`,
              '',
              `Latest commit: \`${process.env.COMMIT_SHA.slice(0, 7)}\` · built by [CI](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

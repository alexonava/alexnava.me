  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <div class="scene-shell" aria-hidden="true">
      <!-- The loading line's star, where the opening shot will show the scene's own. -->
      <div class="scene-star" id="scene-star" hidden>
        <span class="scene-star__glow"></span>
        <span class="scene-star__disc"></span>
      </div>
      <div id="home-scene" class="scene-canvas"></div>
      <div class="scene-vignette"></div>
    </div>
    <div class="site-shell" aria-hidden="true"></div>

    <main id="main" tabindex="-1">
      <section id="home" class="hero section">
        <div class="hero-minimal" id="hero-minimal">
          <h1>
            <span class="hero-word">Alex</span>
            <span class="hero-word">Nava</span>
          </h1>
          <p class="hero-intro">A little about me and what I’m working on.</p>
        </div>
      </section>
    </main>

    <!-- Retain the tour's measured lower safe area without a corner control. -->
    <div class="bottom-bar" aria-hidden="true"><span class="bottom-btn--icon"></span></div>
    <!-- The title card's loading line, shown only while the live scene loads. -->
    <div class="scene-loader" id="scene-loader" aria-hidden="true" hidden>
      <p class="scene-loader__label">
        Loading &middot; <span class="scene-loader__value">0%</span>
      </p>
      <div class="scene-loader__track"><div class="scene-loader__fill"></div></div>
    </div>
    <footer class="site-footer">
      <button
        class="site-footer__link site-footer__contact"
        type="button"
        aria-expanded="true"
        aria-controls="contact-links"
        hidden
      >
        <span class="site-footer__label">Contact</span>
      </button>
      <p class="site-footer__links" id="contact-links">
        <!--email_off--><a class="site-footer__link" href="mailto:alexonava@gmail.com"
          ><span class="site-footer__label">alexonava@gmail.com</span></a
        ><!--/email_off-->
        <a
          class="site-footer__link"
          href="https://www.linkedin.com/in/alex-nava/"
          target="_blank"
          rel="noopener"
          ><span class="site-footer__label">LinkedIn</span></a
        >
      </p>
    </footer>

    <script defer src="/scripts/app.js"></script>
  </body>
</html>
